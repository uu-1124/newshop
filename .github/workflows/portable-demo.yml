name: Portable demo

on:
  push:
    paths:
      - '.dockerignore'
      - '.github/workflows/portable-demo.yml'
      - 'deployment/demo/**'
      - 'deployment/init/**'
      - 'mall-agent/**'
      - 'mall-swarm/**'
      - 'mall-admin-web/**'
      - 'mall-app-web/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  fresh-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deployment/demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare local credentials and kernel setting
        run: |
          umask 077
          python3 generate-env.py > demo.env
          sudo sysctl -w vm.max_map_count=262144
          docker compose --env-file demo.env config --quiet
      - name: Build runtime images
        run: docker compose --env-file demo.env build
      - name: Start from an empty database
        run: docker compose --env-file demo.env up --no-build -d --wait --wait-timeout 480
      - name: Exercise the storefront, admin, search, uploads and support
        run: python3 -u smoke.py
      - name: Publish tested demo images to private GitHub Packages
        if: github.repository == 'uu-1124/newshop' && github.ref == 'refs/heads/codex/portable-demo'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          manifest=$(mktemp)
          for spec in 'JAVA newshop-demo/java:1' 'AGENT newshop-demo/agent:1' 'MYSQL newshop-demo/mysql:8.0.35-1' 'SEARCH newshop-demo/elasticsearch:8.18.0-ik' 'WEB newshop-demo/web:1'; do
            read -r key source <<< "$spec"
            name="ghcr.io/$GITHUB_REPOSITORY_OWNER/newshop-demo-${key,,}"
            tag="$name:sha-$GITHUB_SHA"
            docker tag "$source" "$tag"
            docker push "$tag"
            ref=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -E "^${name}@sha256:[0-9a-f]{64}$")
            printf 'DEMO_%s_IMAGE=%s\n' "$key" "$ref" >> "$manifest"
          done
          {
            echo '### Verified private image references'
            echo 'Use these entries with the Compose file from this commit.'
            printf '%s\n' '```dotenv'
            cat "$manifest"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show service status on failure
        if: failure()
        run: |
          docker compose --env-file demo.env ps -a
          docker compose --env-file demo.env logs --tail=100 search-init search elasticsearch pg-init object-init agent gateway
      - name: Remove the runner's disposable demo project
        if: always()
        run: |
          if test -f demo.env; then
            docker compose --env-file demo.env down --volumes --remove-orphans
          fi
