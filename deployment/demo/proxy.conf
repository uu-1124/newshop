resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 32m;

location = /demo-health { return 204; }
location /demo-assets/ {
    root /srv/shared;
    try_files $uri /demo-assets/unavailable.svg =404;
}
location ^~ /mall/ {
    limit_except GET { deny all; }
    set $storage http://minio:9000;
    proxy_pass $storage;
}
location ~ ^/(mall-portal|mall-admin|mall-search)/(actuator|internal|agent-bridge|agent-staff-bridge)(/|$) { return 404; }
location = /mall-search/esProduct/importAll { return 404; }
location ~ ^/(mall-portal|mall-admin|mall-search|mall-agent/v1/(member|admin))/ {
    set $api http://gateway:8201;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 260s;
}
location / { try_files $uri $uri/ /index.html; }
